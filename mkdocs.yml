site_name: ChatDraw 文档
site_description: ChatArch drawing assistant package shell
site_url: https://arch.gh.wzhecnu.cn/ChatDraw/
repo_url: https://github.com/ChatArch/ChatDraw
repo_name: ChatDraw

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatDraw 文档
        - locale: en
          name: English
          build: true
          site_name: ChatDraw Documentation
          nav_translations:
            首页: Home
            CLI 树: CLI Tree

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  alternate:
    - name: 中文
      link: /ChatDraw/
      lang: zh
    - name: English
      link: /ChatDraw/en/
      lang: en

nav:
  - 首页: index.md
  - CLI 树: cli-tree.md
